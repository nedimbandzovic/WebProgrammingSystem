<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create an account</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6 col-xl-5">
        <section class="card border-0 shadow-sm">
          <div class="card-body p-4 p-sm-5">
            <h1 class="h2 text-center mb-2">Create your account</h1>
            <p class="text-body-secondary text-center mb-4">Sign up to get started.</p>

            <form>
              <div class="mb-3">
                <label for="fullName" class="form-label">Full name</label>
                <input type="text" class="form-control" id="fullName" name="fullName" autocomplete="name" required>
              </div>

              <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input type="email" class="form-control" id="email" name="email" autocomplete="email" required>
              </div>

              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" autocomplete="new-password" minlength="8" required>
                <div class="form-text">Use at least 8 characters.</div>
              </div>

              <div class="mb-4">
                <label for="confirmPassword" class="form-label">Confirm password</label>
                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" autocomplete="new-password" minlength="8" required>
              </div>

              <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="terms" name="terms" required>
                <label class="form-check-label" for="terms">I agree to the terms and conditions</label>
              </div>

              <button type="submit" class="btn btn-primary w-100">Create account</button>
            </form>
          </div>
        </section>
      </div>
    </div>
  </main>
</body>
</html>
